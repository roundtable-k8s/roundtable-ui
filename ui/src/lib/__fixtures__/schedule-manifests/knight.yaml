apiVersion: ai.roundtable.io/v1alpha1
kind: Trigger
metadata:
  annotations:
    ai.roundtable.io/caller: dashboard
  labels:
    app.kubernetes.io/managed-by: roundtable-gateway
  name: morning-brief
  namespace: roundtable
spec:
  concurrency:
    policy: Forbid
  roundTableRef:
    name: fleet-a
  source:
    schedule:
      cron: 0 7 * * 1-5
      timeZone: Europe/Berlin
  target:
    knight:
      name: galahad
      task: |-
        Summarise the overnight alerts.
        List anything still firing: "critical" first.
      timeoutSeconds: 3600
  ttlSecondsAfterFinished: 86400
